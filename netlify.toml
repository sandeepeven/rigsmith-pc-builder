# Static site: no build step — the catalogue is generated locally with
#   node scripts/build-catalog.mjs <opendb>/open-db <docyx>/data/json .
# and committed (catalog.json + data/*.json).
[build]
  publish = "."

# Catalogue chunks have a content hash in their name, so they never change: cache for a year.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The manifest, page, script and styles must always be revalidated (cheap 304s via ETag),
# so a new catalogue or app version is picked up immediately.
[[headers]]
  for = "/catalog.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
